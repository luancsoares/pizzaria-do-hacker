server {
    listen 8080;                 # porta alta: nao precisa de root
    server_name _;
    server_tokens off;           # nao revela a versao do nginx

    # Cabecalhos de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # O frontend chama /api/... e o nginx repassa para o servico da API
    location /api/ {
        proxy_pass http://pizzaria-api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
