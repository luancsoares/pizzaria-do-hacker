# Teste rapido SEM Kubernetes: docker compose up --build
# Depois abra http://localhost:8080
services:
  pizzaria-api:
    build: ./api
    image: pizzaria-api:v1
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  pizzaria-frontend:
    build: ./frontend
    image: pizzaria-frontend:v1
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [pizzaria-api]
