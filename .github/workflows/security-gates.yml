# 🍕 Pizzaria do Hacker — Pipeline com gates de seguranca (Missao 3)
#
#   secrets (Gitleaks) ─┐
#   sast    (Semgrep)  ─┤
#   sca     (pip-audit)─┼──► gate final ──► (Missao 5: deploy no AKS)
#   iac     (Checkov)  ─┤
#   image   (Trivy)    ─┘
#
# Regra de ouro: se QUALQUER gate falhar, o pipeline fica vermelho e nada segue.

name: security-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # botao "Run workflow" na aba Actions

# Least privilege tambem vale para o pipeline: o token do GitHub so pode LER o codigo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versoes FIXAS das ferramentas. Nunca use "latest" num pipeline de seguranca:
  # em marco/2026 tags do trivy-action e a imagem 0.69.4 do Trivy foram comprometidas.
  SEMGREP_VERSION: "1.181.0"
  PIP_AUDIT_VERSION: "2.10.1"
  CHECKOV_VERSION: "3.3.29"
  GITLEAKS_VERSION: "8.24.3"
  TRIVY_IMAGE: "aquasec/trivy:0.69.3"   # versao listada como segura no advisory GHSA-69fq-xp46-6x23

jobs:
  # ───────────────────────────── 1. SECRETS ─────────────────────────────
  secrets:
    name: "🔑 Secrets (Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      # Actions de terceiros fixadas por SHA do commit (tag pode ser movida, SHA nao)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # historico COMPLETO: segredo apagado num commit antigo continua vazado
          persist-credentials: false

      - name: Instalar Gitleaks (com verificacao de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks

      - name: Procurar segredos no historico
        run: ./gitleaks git . --redact --verbose --exit-code 1

  # ───────────────────────────── 2. SAST ────────────────────────────────
  sast:
    name: "🧠 SAST (Semgrep)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Instalar Semgrep
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q "semgrep==${SEMGREP_VERSION}"

      - name: Analise estatica do codigo
        # Regras publicas (Python, JS, Dockerfile) + regras proprias da pizzaria (.semgrep/)
        run: |
          .venv/bin/semgrep scan \
            --config p/python --config p/javascript --config p/dockerfile \
            --config .semgrep/ \
            --exclude .venv \
            --metrics=off --error

  # ───────────────────────────── 3. SCA ─────────────────────────────────
  sca:
    name: "📦 SCA (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Instalar pip-audit
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Procurar bibliotecas com CVE conhecida
        run: .venv/bin/pip-audit -r api/requirements.txt --desc

  # ───────────────────────────── 4. IaC ─────────────────────────────────
  iac:
    name: "🏗️ IaC (Checkov)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Instalar Checkov
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q "checkov==${CHECKOV_VERSION}"

      - name: Analisar manifests Kubernetes e Dockerfiles
        # Excecoes aceitas (com justificativa) ficam em .checkov.yaml
        run: .venv/bin/checkov -d .

  # ───────────────────────────── 5. IMAGEM ──────────────────────────────
  image:
    name: "🐳 Imagem (Trivy)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}

      - name: Build da imagem
        run: docker build -t pizzaria-${{ matrix.app }}:ci ./${{ matrix.app }}

      - name: Scan de vulnerabilidades (HIGH/CRITICAL com correcao disponivel)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            pizzaria-${{ matrix.app }}:ci

  # ───────────────────────────── GATE FINAL ─────────────────────────────
  gate:
    name: "🚦 Gate final"
    runs-on: ubuntu-24.04
    needs: [secrets, sast, sca, iac, image]
    if: always()
    steps:
      - name: Placar
        env:
          R_SECRETS: ${{ needs.secrets.result }}
          R_SAST: ${{ needs.sast.result }}
          R_SCA: ${{ needs.sca.result }}
          R_IAC: ${{ needs.iac.result }}
          R_IMAGE: ${{ needs.image.result }}
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## 🍕 Pizzaria do Hacker — Placar de seguranca"
            echo "| Gate | Ferramenta | Resultado |"
            echo "|---|---|---|"
            echo "| Secrets | Gitleaks | $(icon $R_SECRETS) $R_SECRETS |"
            echo "| SAST | Semgrep | $(icon $R_SAST) $R_SAST |"
            echo "| SCA | pip-audit | $(icon $R_SCA) $R_SCA |"
            echo "| IaC | Checkov | $(icon $R_IAC) $R_IAC |"
            echo "| Imagem | Trivy | $(icon $R_IMAGE) $R_IMAGE |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in $R_SECRETS $R_SAST $R_SCA $R_IAC $R_IMAGE; do
            if [ "$r" != "success" ]; then
              echo "🚫 Deploy BLOQUEADO: pelo menos um gate falhou." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "🟢 Todos os gates passaram. Liberado para deploy." | tee -a "$GITHUB_STEP_SUMMARY"
