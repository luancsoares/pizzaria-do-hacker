# Dependabot: abre Pull Requests sozinho quando sair versao nova (ou correcao de CVE)
# das bibliotecas Python, das imagens base dos Dockerfiles e das Actions do pipeline.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/api, /frontend]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
