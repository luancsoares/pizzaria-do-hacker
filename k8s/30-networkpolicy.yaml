# Zero trust dentro do cluster:
# 1) tudo bloqueado por padrao; 2) libera so o necessario.
# Obs: o Kubernetes do Docker Desktop NAO aplica NetworkPolicy (falta plugin de rede).
# Vamos ver estas regras funcionando de verdade no AKS, na Missao 5.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pizzaria
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-recebe-de-fora
  namespace: pizzaria
spec:
  podSelector:
    matchLabels: {app: pizzaria-frontend}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-fala-com-api
  namespace: pizzaria
spec:
  podSelector:
    matchLabels: {app: pizzaria-frontend}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: pizzaria-api}
      ports: [{port: 8000}]
    - to:                                   # DNS, para achar o nome "pizzaria-api"
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-so-aceita-frontend
  namespace: pizzaria
spec:
  podSelector:
    matchLabels: {app: pizzaria-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: pizzaria-frontend}
      ports: [{port: 8000}]
