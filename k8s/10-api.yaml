apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzaria-api
  namespace: pizzaria
  labels: {app: pizzaria-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pizzaria-api}
  template:
    metadata:
      labels: {app: pizzaria-api}
    spec:
      automountServiceAccountToken: false     # a app nao fala com a API do K8s: sem token montado
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: pizzaria-api:v1              # tag fixa, nunca "latest"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pizzaria-api
  namespace: pizzaria
spec:
  selector: {app: pizzaria-api}
  ports: [{port: 8000, targetPort: 8000}]
  # ClusterIP (padrao): a API NAO fica exposta fora do cluster
