apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizzaria-frontend
  namespace: pizzaria
  labels: {app: pizzaria-frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pizzaria-frontend}
  template:
    metadata:
      labels: {app: pizzaria-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: pizzaria-frontend:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
          livenessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}    # unico lugar gravavel (cache e pid do nginx)
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: pizzaria-frontend
  namespace: pizzaria
spec:
  type: NodePort
  selector: {app: pizzaria-frontend}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
