# Namespace com Pod Security Admission no nivel "restricted":
# o proprio Kubernetes RECUSA pods que rodem como root, com privilegios, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: pizzaria
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
